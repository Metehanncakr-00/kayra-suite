[package]
name = "kayra-suite"
version = "1.0.3"
description = "KAYRA Suite - Yerel Belge ve Gorsel Tasarim Ekosistemi"
authors = ["Metehan Cakir"]
edition = "2021"

[lib]
name = "kayra_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
